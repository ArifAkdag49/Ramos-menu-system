# PR doğrulaması. Yalnız PR'da çalışıyor (oto-push her Claude cevabından sonra
# push ediyor; her birinde koşmak Actions dakikalarını boşa harcar). deploy.yml de
# main'e girişte bunu çağırıyor.
name: Doğrulama

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Testler Supabase istemcisini kuruyor ama gerçek sunucuya gitmiyor; adres yalnız
    # createClient boş değer görmesin diye. Üretim değerleri sunucuda (/opt/statik/ramos).
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: ci-test-anon-key
      VITE_STAFF_EMAIL_DOMAIN: ramos.test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
