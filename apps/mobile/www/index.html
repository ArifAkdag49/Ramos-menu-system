<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Ramo's</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0a0a; color: #f5f5f5;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 20px; padding: 24px; box-sizing: border-box; text-align: center; }
      h1 { font-size: 22px; margin: 0; font-weight: 600; }
      p { margin: 0; color: #a3a3a3; font-size: 15px; line-height: 1.5; }
      button { font: inherit; font-weight: 600; padding: 14px 28px; border-radius: 12px; border: 0;
        background: #f5f5f5; color: #0a0a0a; min-width: 180px; }
      button:active { opacity: .8; }
    </style>
  </head>
  <body>
    <main>
      <h1>İnternet bağlantısı yok</h1>
      <p>Ramo's sunucusuna ulaşılamadı. Wi-Fi ya da mobil veriyi kontrol edip tekrar deneyin.</p>
      <button id="retry" type="button">Tekrar dene</button>
    </main>
    <script>
      // Çevrimdışı yedek sayfa: canlı siteye yeniden gitmeyi dener.
      var SITE = 'https://ramos.arxdigitalsevice.com/';
      document.getElementById('retry').addEventListener('click', function () { location.replace(SITE); });
      window.addEventListener('online', function () { location.replace(SITE); });
    </script>
  </body>
</html>
